[build]
  publish = "."
  command = "echo 'No build step needed'"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/ses.html"
  to = "/cozumlerimiz/ses/"
  status = 301

[[redirects]]
  from = "/sohbet.html"
  to = "/cozumlerimiz/sohbet/"
  status = 301

[[redirects]]
  from = "/sektorler.html"
  to = "/sektorler/"
  status = 301

[[redirects]]
  from = "/hesaplama.html"
  to = "/sektorler/#calc"
  status = 301

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
